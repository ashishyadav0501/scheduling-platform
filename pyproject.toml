[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-platform"
version = "0.1.0"
description = "Scheduling platform backend - Part 1: foundations and CRUD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["import-linter>=2.0"]

[tool.setuptools.packages.find]
include = ["app*"]